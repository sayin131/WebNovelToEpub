name: Build apps

on:
  push:
    tags: ["v*"]          # e.g. git tag v1.0.0 && git push --tags
  workflow_dispatch:      # or run manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            extra: --onefile
          - os: macos-latest        # Apple Silicon
            extra: ""
          - os: ubuntu-latest
            extra: --onefile
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tk for Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build app
        run: >
          pyinstaller --noconfirm --windowed --name NovelToEpub ${{ matrix.extra }}
          --collect-all playwright --hidden-import PIL.Image novel2epub_gui.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/NovelToEpub.exe -DestinationPath NovelToEpub-Windows.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/NovelToEpub.app NovelToEpub-macOS-AppleSilicon.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip ../NovelToEpub-Linux.zip NovelToEpub

      - uses: actions/upload-artifact@v4
        with:
          name: NovelToEpub-${{ runner.os }}
          path: NovelToEpub-*.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NovelToEpub-*.zip
